<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPA SHOPPER</title>
    <style>
        :root {
            --bg: #000000;
            --red: #FF0000;
            --glass: rgba(25, 25, 25, 0.85);
            --border: rgba(255, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            text-transform: uppercase;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 10%, rgba(255, 0, 0, 0.15), transparent 50%);
        }

        .container {
            padding: 25px;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            padding-bottom: 150px;
        }

        .header { margin-top: 50px; margin-bottom: 30px; }
        .header h1 { font-size: 48px; font-weight: 900; margin: 0; letter-spacing: -2px; }

        /* TAB LOGIC */
        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .active-view { display: block !important; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .arch-header {
            background: var(--red);
            color: black;
            padding: 5px 15px;
            font-weight: 900;
            font-size: 14px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .compat-list {
            font-size: 10px;
            color: #888;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .app-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .app-icon { width: 70px; height: 70px; border-radius: 16px; background: #111; object-fit: cover; }
        .app-info { flex-grow: 1; }
        .app-info h3 { margin: 0; font-size: 18px; font-weight: 900; }
        .app-info p { margin: 4px 0 0; font-size: 10px; color: var(--red); font-weight: 900; }

        .btn-get {
            background: var(--red);
            color: white;
            text-decoration: none;
            font-weight: 900;
            font-size: 12px;
            padding: 10px 20px;
            border-radius: 20px;
        }

        /* DOCK NAVIGATION */
        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 0, 0, 0.95);
            border: 2px solid var(--red);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            gap: 30px;
            z-index: 1000;
        }

        .dock-btn { 
            color: #555; 
            font-weight: 900; 
            font-size: 13px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .dock-btn.active { color: var(--red); }
    </style>
</head>
<body>

    <div class="container">
        <header class="header"><h1>SHOPPER</h1></header>

        <div id="view-64" class="tab-content active-view">
            <div class="arch-header">64-BIT LIBRARY</div>
            <div class="compat-list">IPAD AIR / PRO / MINI 2+ (IOS 11+)</div>

            <div class="app-card" style="opacity: 0.5;">
                <div class="app-icon" style="display:flex; align-items:center; justify-content:center; color:#333;">?</div>
                <div class="app-info"><h3>COMING SOON</h3><p>64-BIT APPS</p></div>
                <span class="btn-get" style="background:#222;">...</span>
            </div>
        </div>

        <div id="view-32" class="tab-content">
            <div class="arch-header">32-BIT LIBRARY</div>
            <div class="compat-list">IPAD 1-4 / MINI 1 (IOS 6-10)</div>

            <div class="app-card">
                <img src="fnaf1_icon.png" class="app-icon">
                <div class="app-info"><h3>FNAF 1</h3><p>LEGACY IPA</p></div>
                <a href="https://github.com/EddieTLOU/IPA/releases/download/v1.0/fnaf1.ipa" class="btn-get">GET</a>
            </div>

            <div class="app-card">
                <img src="fnaf2_icon.png" class="app-icon">
                <div class="app-info"><h3>FNAF 2</h3><p>LEGACY IPA</p></div>
                <a href="https://github.com/EddieTLOU/IPA/releases/download/v1.0/fnaf2.ipa" class="btn-get">GET</a>
            </div>

            <div class="app-card">
                <img src="fnaf3_icon.png" class="app-icon">
                <div class="app-info"><h3>FNAF 3</h3><p>LEGACY IPA</p></div>
                <a href="https://github.com/EddieTLOU/IPA/releases/download/v1.0/fnaf3.ipa" class="btn-get">GET</a>
            </div>

            <div class="app-card">
                <img src="fnaf4_icon.png" class="app-icon">
                <div class="app-info"><h3>FNAF 4</h3><p>LEGACY IPA</p></div>
                <a href="https://github.com/EddieTLOU/IPA/releases/download/v1.0/fnaf4.ipa" class="btn-get">GET</a>
            </div>
        </div>

    </div>

    <nav class="dock">
        <div class="dock-btn active" id="btn-64" onclick="showTab('64')">64-BIT</div>
        <div class="dock-btn" id="btn-32" onclick="showTab('32')">32-BIT</div>
    </nav>

    <script>
        function showTab(arch) {
            // Hide all views
            document.querySelectorAll('.tab-content').forEach(view => view.classList.remove('active-view'));
            // Remove active color from buttons
            document.querySelectorAll('.dock-btn').forEach(btn => btn.classList.remove('active'));

            // Show selected view
            document.getElementById('view-' + arch).classList.add('active-view');
            // Light up selected button
            document.getElementById('btn-' + arch).classList.add('active');
        }
    </script>

</body>
</html>
